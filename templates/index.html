<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Image Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center my-4">
                    <i class="bi bi-search"></i> PDF Image Search
                </h1>
                <p class="text-center text-muted">
                    Upload a PDF file and an image to search for within the PDF
                </p>
            </div>
        </div>
        
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body">
                        <form id="searchForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="pdfFile" class="form-label">
                                    <i class="bi bi-file-earmark-pdf"></i> PDF File
                                </label>
                                <input type="file" class="form-control" id="pdfFile" name="pdf_file" 
                                       accept=".pdf" required>
                                <div class="form-text">Maximum file size: 50MB</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="imageFile" class="form-label">
                                    <i class="bi bi-image"></i> Image to Search
                                </label>
                                <input type="file" class="form-control" id="imageFile" name="image_file" 
                                       accept=".jpg,.jpeg,.png,.bmp,.tiff,.tif" required>
                                <div class="form-text">Supported: JPG, PNG, BMP, TIFF</div>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg" id="searchBtn">
                                    <i class="bi bi-search"></i> Start Search
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- Progress Section -->
                <div id="progressSection" class="card shadow mt-4" style="display: none;">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="bi bi-hourglass-split"></i> Search Progress
                        </h5>
                        <div class="progress mb-3">
                            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                                 role="progressbar" style="width: 0%"></div>
                        </div>
                        <div id="progressText" class="text-muted">Initializing...</div>
                        <div id="progressStats" class="mt-2 small text-muted"></div>
                    </div>
                </div>
                
                <!-- Results Section -->
                <div id="resultsSection" class="card shadow mt-4" style="display: none;">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="bi bi-check-circle"></i> Search Results
                        </h5>
                        <div id="resultsContent"></div>
                    </div>
                </div>
                
                <!-- Error Section -->
                <div id="errorSection" class="alert alert-danger mt-4" style="display: none;">
                    <h5 class="alert-heading">
                        <i class="bi bi-exclamation-triangle"></i> Error
                    </h5>
                    <p id="errorMessage"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
